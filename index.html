<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2V0-15.25 試験対策クイズ</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f6fa;
      --bg-dark: #1f2430;
      --card-bg: #fff;
      --card-bg-dark: #2b3245;
      --border: #d9deeb;
      --border-dark: #3a4156;
      --text: #1b1f2a;
      --text-dark: #f5f6fb;
      --primary: #0077c6;
      --primary-dark: #5cc4ff;
      --danger: #d64045;
      --warning: #f59f00;
      --warning-dark: #ffd166;
      --success: #2d9d4f;
      --success-dark: #6ce29a;
      font-family: "Noto Sans JP", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: var(--bg-dark);
        color: var(--text-dark);
      }
    }

    .container {
      width: min(960px, 100%);
      display: grid;
      gap: 24px;
    }

    .header {
      padding: 24px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(35, 55, 90, 0.12);
    }

    .header h1 {
      margin-top: 0;
      margin-bottom: 12px;
    }

    .header p {
      margin: 0;
      line-height: 1.6;
    }

    @media (prefers-color-scheme: dark) {
      .header {
        background: var(--card-bg-dark);
        border-color: var(--border-dark);
        box-shadow: none;
      }
    }

    .loader {
      margin-top: 16px;
      display: grid;
      gap: 12px;
    }

    .loader-controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .status {
      margin: 0;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: rgba(0, 0, 0, 0.04);
      font-size: 0.9rem;
    }

    .status--info {
      border-color: rgba(0, 119, 198, 0.25);
      background: rgba(0, 119, 198, 0.08);
      color: var(--primary);
    }

    .status--success {
      border-color: rgba(45, 157, 79, 0.2);
      background: rgba(45, 157, 79, 0.08);
      color: var(--success);
    }

    .status--warn {
      border-color: rgba(245, 159, 0, 0.25);
      background: rgba(245, 159, 0, 0.1);
      color: var(--warning);
    }

    .status--error {
      border-color: rgba(214, 64, 69, 0.3);
      background: rgba(214, 64, 69, 0.1);
      color: var(--danger);
    }

    @media (prefers-color-scheme: dark) {
      .status {
        border-color: rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.05);
      }
      .status--info {
        border-color: rgba(92, 196, 255, 0.35);
        background: rgba(92, 196, 255, 0.12);
        color: var(--primary-dark);
      }
      .status--success {
        border-color: rgba(108, 226, 154, 0.4);
        background: rgba(108, 226, 154, 0.18);
        color: var(--success-dark);
      }
      .status--warn {
        border-color: rgba(255, 209, 102, 0.4);
        background: rgba(255, 209, 102, 0.18);
        color: var(--warning-dark);
      }
      .status--error {
        border-color: rgba(214, 64, 69, 0.4);
        background: rgba(214, 64, 69, 0.2);
        color: var(--danger);
      }
    }

    .quiz {
      display: grid;
      gap: 24px;
    }

    .quiz__empty {
      margin: 0;
      padding: 24px;
      text-align: center;
      background: var(--card-bg);
      border: 1px dashed var(--border);
      border-radius: 16px;
      color: #6a728f;
    }

    @media (prefers-color-scheme: dark) {
      .quiz__empty {
        background: var(--card-bg-dark);
        border-color: var(--border-dark);
        color: rgba(245, 246, 251, 0.7);
      }
    }

    .question {
      padding: 24px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(35, 55, 90, 0.1);
    }

    @media (prefers-color-scheme: dark) {
      .question {
        background: var(--card-bg-dark);
        border-color: var(--border-dark);
        box-shadow: none;
      }
    }

    .question__title {
      margin: 0 0 8px;
      font-size: 1.2rem;
      line-height: 1.5;
    }

    .question__type {
      margin: 0 0 16px;
      font-size: 0.9rem;
      color: #566080;
    }

    @media (prefers-color-scheme: dark) {
      .question__type {
        color: rgba(245, 246, 251, 0.6);
      }
    }

    .question__form {
      display: grid;
      gap: 12px;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: rgba(0, 0, 0, 0.02);
      border-radius: 8px;
      padding: 12px 16px;
      border: 1px solid transparent;
      transition: border 0.2s ease, background 0.2s ease;
    }

    .option input {
      margin-top: 4px;
    }

    .option.is-correct {
      border-color: var(--primary);
    }

    .option.is-incorrect {
      border-color: var(--danger);
    }

    .option.is-partial {
      border-color: var(--warning);
    }

    .option.muted {
      opacity: 0.55;
    }

    @media (prefers-color-scheme: dark) {
      .option {
        background: rgba(255, 255, 255, 0.03);
      }
    }

    .question__actions {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #00a2ff);
      color: #fff;
      box-shadow: 0 10px 24px rgba(0, 119, 198, 0.2);
    }

    .btn-primary:disabled {
      background: #b0c8dd;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-secondary {
      background: rgba(0, 0, 0, 0.08);
      color: inherit;
    }

    @media (prefers-color-scheme: dark) {
      .btn-secondary {
        background: rgba(255, 255, 255, 0.1);
        color: var(--text-dark);
      }
    }

    .btn.reset {
      background: rgba(0, 0, 0, 0.08);
      color: inherit;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
    }

    @media (prefers-color-scheme: dark) {
      .btn.reset {
        background: rgba(255, 255, 255, 0.08);
      }
    }

    .question__feedback {
      margin-top: 16px;
      padding: 16px;
      border-radius: 12px;
      background: rgba(0, 119, 198, 0.08);
      border: 1px solid rgba(0, 119, 198, 0.2);
    }

    .question__feedback.is-incorrect {
      background: rgba(214, 64, 69, 0.1);
      border-color: rgba(214, 64, 69, 0.3);
    }

    .question__feedback.is-partial {
      background: rgba(245, 159, 0, 0.12);
      border-color: rgba(245, 159, 0, 0.35);
    }

    @media (prefers-color-scheme: dark) {
      .question__feedback {
        background: rgba(92, 196, 255, 0.1);
        border: 1px solid rgba(92, 196, 255, 0.3);
      }
      .question__feedback.is-incorrect {
        background: rgba(214, 64, 69, 0.15);
      }
      .question__feedback.is-partial {
        background: rgba(255, 209, 102, 0.18);
        border-color: rgba(255, 209, 102, 0.4);
      }
      .btn.reset {
        background: rgba(255, 255, 255, 0.08);
      }
    }

    .question__result {
      margin: 0 0 8px;
      font-weight: 700;
    }

    .question__explanation {
      margin: 0;
      white-space: pre-line;
    }

    .question__edit {
      margin-top: 16px;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: rgba(0, 0, 0, 0.03);
    }

    .question__edit-form {
      display: grid;
      gap: 16px;
    }

    .question__edit-options {
      margin: 0;
      padding: 0;
      border: none;
    }

    .question__edit-label {
      display: grid;
      gap: 8px;
      font-weight: 600;
    }

    .question__edit-options legend {
      font-weight: 600;
      margin-bottom: 8px;
    }

    .question__edit-options-list {
      display: grid;
      gap: 8px;
    }

    .question__edit-option {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .question__edit-option input {
      margin-top: 4px;
    }

    .question__edit-explanation {
      width: 100%;
      min-height: 96px;
      resize: vertical;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-family: inherit;
      line-height: 1.5;
    }

    .question__edit-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .question__edit-message {
      margin: 0;
      font-size: 0.9rem;
    }

    .question__edit-message.is-error {
      color: var(--danger);
    }

    .question__edit-message.is-success {
      color: var(--success);
    }

    .question__partial-list {
      display: grid;
      gap: 8px;
    }

    .question__partial-empty {
      margin: 0;
      font-size: 0.9rem;
      color: #6a728f;
    }

    .question__partial-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: rgba(0, 0, 0, 0.03);
    }

    .question__partial-label {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .question__partial-chip {
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(0, 119, 198, 0.12);
      color: var(--primary);
      font-size: 0.85rem;
    }

    .question__partial-builder {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(0, 0, 0, 0.08);
      display: grid;
      gap: 12px;
    }

    .question__partial-builder p {
      margin: 0;
      font-size: 0.88rem;
      color: #566080;
    }

    .question__partial-options {
      display: grid;
      gap: 8px;
    }

    .question__partial-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .builder {
      margin-top: 24px;
      display: grid;
      gap: 16px;
    }

    .builder-panel {
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card-bg);
      box-shadow: 0 10px 24px rgba(35, 55, 90, 0.1);
    }

    .builder-form {
      display: grid;
      gap: 20px;
    }

    .builder-grid {
      display: grid;
      gap: 16px;
    }

    .builder-grid.two-columns {
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    }

    .builder-field {
      display: grid;
      gap: 8px;
    }

    .builder-field label {
      font-weight: 600;
    }

    .builder-field input[type='text'],
    .builder-field textarea,
    .builder-field select {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-family: inherit;
      font-size: 1rem;
    }

    .builder-field textarea {
      min-height: 96px;
      resize: vertical;
      line-height: 1.5;
    }

    .builder-options {
      display: grid;
      gap: 12px;
    }

    .builder-option {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: rgba(0, 0, 0, 0.03);
    }

    .builder-option-index {
      font-weight: 600;
      color: #566080;
      min-width: 20px;
    }

    .builder-option-input {
      display: grid;
      gap: 8px;
    }

    .builder-option-input input[type='text'] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .builder-option-controls {
      display: grid;
      gap: 8px;
      justify-items: end;
    }

    .builder-option-controls label {
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .builder-option-controls .btn {
      padding: 6px 12px;
    }

    .builder-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .builder-message {
      margin: 0;
      font-size: 0.9rem;
    }

    .builder-message.is-error {
      color: var(--danger);
    }

    .builder-message.is-success {
      color: var(--success);
    }

    @media (prefers-color-scheme: dark) {
      .question__edit {
        border-color: rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.05);
      }
      .question__edit-explanation {
        border-color: var(--border-dark);
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-dark);
      }
      .question__partial-item {
        border-color: rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.06);
      }
      .question__partial-chip {
        background: rgba(92, 196, 255, 0.15);
        color: var(--primary-dark);
      }
      .question__partial-builder {
        border-top-color: rgba(255, 255, 255, 0.1);
      }
      .question__partial-builder p {
        color: rgba(245, 246, 251, 0.7);
      }
      .builder-panel {
        background: var(--card-bg-dark);
        border-color: var(--border-dark);
        box-shadow: none;
      }
      .builder-field input[type='text'],
      .builder-field textarea,
      .builder-field select {
        border-color: var(--border-dark);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text-dark);
      }
      .builder-option {
        border-color: rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.05);
      }
      .builder-option-index {
        color: rgba(245, 246, 251, 0.7);
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <h1 id="exam-title">試験対策クイズ</h1>
      <p id="exam-description">問題を解いて理解度を確認しましょう。選択肢を選んで「答えを表示」を押すと、正解・部分正解・不正解の判定と補足が表示されます。questions.jsonを書き換えることで出題内容を更新できます。</p>
      <div class="loader">
        <div class="loader-controls">
          <button type="button" class="btn btn-secondary" id="load-button">questions.json を選択</button>
          <button type="button" class="btn btn-secondary" id="download-button" disabled>JSONをダウンロード</button>
          <input type="file" id="file-input" accept="application/json" hidden>
        </div>
        <p class="status status--info" id="status">questions.json を自動読み込みしています…</p>
      </div>
    </header>
    <div class="builder">
      <button type="button" class="btn btn-secondary" id="builder-toggle">新しい問題を追加</button>
      <section class="builder-panel" id="question-builder" hidden>
        <form class="builder-form" id="question-builder-form">
          <div class="builder-grid two-columns">
            <div class="builder-field">
              <label for="builder-id">問題ID（任意）</label>
              <input type="text" id="builder-id" placeholder="例: workspace-one-enrollment">
            </div>
            <div class="builder-field">
              <label for="builder-type">問題タイプ</label>
              <select id="builder-type">
                <option value="single">単一選択</option>
                <option value="multiple">複数選択</option>
              </select>
            </div>
          </div>
          <div class="builder-field">
            <label for="builder-prompt">問題文</label>
            <textarea id="builder-prompt" placeholder="問題文を入力してください" required></textarea>
          </div>
          <div class="builder-field">
            <label>選択肢</label>
            <div class="builder-options" id="builder-options"></div>
            <button type="button" class="btn btn-secondary" id="builder-add-option">選択肢を追加</button>
          </div>
          <fieldset class="question__edit-partial">
            <legend>部分正解パターン（任意）</legend>
            <div class="question__partial-list" id="builder-partial-list"></div>
            <div class="question__partial-builder">
              <p>部分的に正解とみなしたい選択肢の組み合わせを選んで追加してください。</p>
              <div class="question__partial-options" id="builder-partial-options"></div>
              <div class="question__partial-actions">
                <button type="button" class="btn btn-secondary" id="builder-partial-add">パターン追加</button>
                <button type="button" class="btn btn-secondary" id="builder-partial-clear">選択クリア</button>
              </div>
            </div>
          </fieldset>
          <div class="builder-field">
            <label for="builder-explanation">補足説明</label>
            <textarea id="builder-explanation" placeholder="正解の補足を入力してください"></textarea>
          </div>
          <div class="builder-actions">
            <button type="submit" class="btn btn-primary">問題を追加</button>
            <button type="button" class="btn btn-secondary" id="builder-cancel">キャンセル</button>
          </div>
          <p class="builder-message" id="builder-message" hidden></p>
        </form>
      </section>
    </div>
    <section id="quiz" class="quiz" aria-live="polite"></section>
  </main>

  <template id="question-template">
    <article class="question">
      <h2 class="question__title"></h2>
      <p class="question__type"></p>
      <form class="question__form"></form>
      <div class="question__actions">
        <button type="button" class="btn btn-primary show-answer">答えを表示</button>
        <button type="button" class="btn reset">リセット</button>
        <button type="button" class="btn btn-secondary edit-question">編集</button>
      </div>
      <div class="question__feedback" hidden>
        <p class="question__result"></p>
        <p class="question__explanation"></p>
      </div>
      <div class="question__edit" hidden>
        <form class="question__edit-form">
          <fieldset class="question__edit-options">
            <legend>正解の選択肢</legend>
            <div class="question__edit-options-list"></div>
          </fieldset>
          <fieldset class="question__edit-partial">
            <legend>部分正解パターン（任意）</legend>
            <div class="question__partial-list"></div>
            <div class="question__partial-builder">
              <p>部分的に正解とみなしたい選択肢の組み合わせを選んで追加してください。</p>
              <div class="question__partial-options"></div>
              <div class="question__partial-actions">
                <button type="button" class="btn btn-secondary partial-add">パターン追加</button>
                <button type="button" class="btn btn-secondary partial-clear">選択クリア</button>
              </div>
            </div>
          </fieldset>
          <label class="question__edit-label">
            補足説明
            <textarea class="question__edit-explanation" placeholder="補足を入力してください"></textarea>
          </label>
          <div class="question__edit-actions">
            <button type="button" class="btn btn-primary save-edit">保存</button>
            <button type="button" class="btn btn-secondary cancel-edit">キャンセル</button>
          </div>
          <p class="question__edit-message" hidden></p>
        </form>
      </div>
    </article>
  </template>

  <script type="module">
    const quizContainer = document.getElementById('quiz');
    const questionTemplate = document.getElementById('question-template');
    const statusEl = document.getElementById('status');
    const loadButton = document.getElementById('load-button');
    const downloadButton = document.getElementById('download-button');
    const fileInput = document.getElementById('file-input');
    const titleEl = document.getElementById('exam-title');
    const descriptionEl = document.getElementById('exam-description');
    const builderToggleBtn = document.getElementById('builder-toggle');
    const builderPanel = document.getElementById('question-builder');
    const builderForm = document.getElementById('question-builder-form');
    const builderIdInput = document.getElementById('builder-id');
    const builderTypeSelect = document.getElementById('builder-type');
    const builderPromptInput = document.getElementById('builder-prompt');
    const builderOptionsContainer = document.getElementById('builder-options');
    const builderAddOptionBtn = document.getElementById('builder-add-option');
    const builderPartialList = document.getElementById('builder-partial-list');
    const builderPartialOptions = document.getElementById('builder-partial-options');
    const builderPartialAddBtn = document.getElementById('builder-partial-add');
    const builderPartialClearBtn = document.getElementById('builder-partial-clear');
    const builderExplanationInput = document.getElementById('builder-explanation');
    const builderMessageEl = document.getElementById('builder-message');
    const builderCancelBtn = document.getElementById('builder-cancel');

    const QUESTION_TYPE_LABEL = {
      single: '【単一選択】最も適切な選択肢を1つ選んでください',
      multiple: '【複数選択】該当するものをすべて選んでください',
    };

    const RESULT_MESSAGES = {
      correct: '正解です。',
      partial: '惜しいです。ほぼ正解なので補足を確認しましょう。',
      incorrect: '不正解です。正しい選択肢を確認しましょう。',
    };

    let currentPayload = null;
    let builderOptionCounter = 0;

    init();

    downloadButton.addEventListener('click', () => {
      if (!currentPayload) {
        return;
      }
      downloadCurrentPayload();
    });

    builderToggleBtn.addEventListener('click', () => {
      if (builderPanel.hidden) {
        openBuilder();
      } else {
        closeBuilder();
      }
    });

    builderTypeSelect.addEventListener('change', () => {
      syncBuilderCorrectInputs();
      removeInvalidBuilderPartials();
      updateBuilderPartialOptions();
      showBuilderMessage('', 'clear');
    });

    builderAddOptionBtn.addEventListener('click', () => {
      addBuilderOptionRow();
      syncBuilderCorrectInputs();
      updateBuilderOptionIndices();
      updateBuilderPartialOptions();
      removeInvalidBuilderPartials();
    });

    builderOptionsContainer.addEventListener('click', (event) => {
      const removeBtn = event.target.closest('.builder-option-remove');
      if (!removeBtn) {
        return;
      }
      const rows = getBuilderOptionRows();
      if (rows.length <= 2) {
        showBuilderMessage('選択肢は最低2つ必要です。', 'error');
        return;
      }
      const optionRow = removeBtn.closest('.builder-option');
      if (!optionRow) {
        return;
      }
      const key = optionRow.dataset.optionKey;
      optionRow.remove();
      updateBuilderOptionIndices();
      syncBuilderCorrectInputs();
      removeBuilderPartialsForKey(key);
      updateBuilderPartialOptions();
      showBuilderMessage('選択肢を削除しました。', 'success');
    });

    builderOptionsContainer.addEventListener('input', (event) => {
      if (event.target.matches('.builder-option-text')) {
        updateBuilderPartialLabels();
      }
    });

    builderOptionsContainer.addEventListener('change', (event) => {
      if (event.target.matches('.builder-correct-input')) {
        if (builderTypeSelect.value !== 'multiple') {
          syncBuilderCorrectInputs();
        }
        removeInvalidBuilderPartials();
      }
    });

    builderPartialAddBtn.addEventListener('click', () => {
      const type = builderTypeSelect.value === 'multiple' ? 'multiple' : 'single';
      const optionMap = createBuilderOptionMap();
      const selection = collectEditSelections(builderPartialOptions).map(String);
      const normalized = selection.slice().sort();
      if (normalized.length === 0) {
        showBuilderMessage('部分正解にする選択肢を選んでください。', 'error');
        return;
      }
      if (type === 'single') {
        if (normalized.length !== 1) {
          showBuilderMessage('単一選択では部分正解も1つだけ選択してください。', 'error');
          return;
        }
        const correctIds = getBuilderCorrectKeys();
        if (correctIds.includes(normalized[0])) {
          showBuilderMessage('正解と同じ選択肢は部分正解に設定できません。', 'error');
          return;
        }
      } else {
        const correctIds = new Set(getBuilderCorrectKeys());
        if (normalized.every((key) => correctIds.has(key)) && correctIds.size === normalized.length) {
          showBuilderMessage('正解と同じ組み合わせは部分正解に設定できません。', 'error');
          return;
        }
      }
      if (hasPartialCombination(builderPartialList, normalized)) {
        showBuilderMessage('同じ部分正解パターンが既に存在します。', 'error');
        return;
      }
      appendPartialItem(builderPartialList, normalized, optionMap);
      clearSelections(builderPartialOptions);
      showBuilderMessage('部分正解パターンを追加しました。', 'success');
    });

    builderPartialClearBtn.addEventListener('click', () => {
      clearSelections(builderPartialOptions);
      showBuilderMessage('部分正解の選択をクリアしました。', 'success');
    });

    builderPartialList.addEventListener('click', (event) => {
      const removeBtn = event.target.closest('.partial-remove');
      if (!removeBtn) {
        return;
      }
      const item = removeBtn.closest('.question__partial-item');
      if (!item) {
        return;
      }
      item.remove();
      ensurePartialEmptyState(builderPartialList);
      showBuilderMessage('部分正解パターンを削除しました。', 'success');
    });

    builderCancelBtn.addEventListener('click', () => {
      closeBuilder();
    });

    builderForm.addEventListener('submit', (event) => {
      event.preventDefault();
      try {
        const question = buildQuestionFromBuilder();
        ensurePayload();
        currentPayload.questions.push(question);
        renderQuiz(currentPayload.questions);
        updateBuilderPartialOptions();
        setStatus(`新しい問題「${truncateText(question.prompt, 24)}」を追加しました。JSONをダウンロードして保存してください。`, 'success');
        updateDownloadState(true);
        showBuilderMessage('問題を追加しました。続けて作成できます。', 'success');
        resetBuilderForm({ keepOpen: true });
      } catch (error) {
        console.error(error);
        showBuilderMessage(error.message ?? '問題の追加に失敗しました。入力内容を確認してください。', 'error');
      }
    });

    async function init() {
      const autoLoaded = await tryLoadDefaultFile();
      if (!autoLoaded) {
        setStatus('questions.json を自動読み込みできませんでした。上のボタンからファイルを選択してください。', 'warn');
        updateDownloadState(false);
      }
    }

    async function tryLoadDefaultFile() {
      try {
        const response = await fetch('questions.json', { cache: 'no-cache' });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const text = await response.text();
        const payload = parseQuestions(text);
        currentPayload = payload;
        applyMetadata(payload);
        renderQuiz(payload.questions);
        updateDownloadState(true);
        setStatus('questions.json から読み込みました。', 'success');
        return true;
      } catch (error) {
        console.warn('questions.json の自動読み込みに失敗しました。', error);
        updateDownloadState(false);
        return false;
      }
    }

    loadButton.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (event) => {
      const [file] = event.target.files ?? [];
      if (!file) {
        return;
      }
      readQuestionsFromFile(file);
      fileInput.value = '';
    });

    function readQuestionsFromFile(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const text = String(reader.result ?? '');
          const payload = parseQuestions(text);
          currentPayload = payload;
          applyMetadata(payload);
          renderQuiz(payload.questions);
          updateDownloadState(true);
          setStatus(`${file.name} から読み込みました。`, 'success');
        } catch (error) {
          console.error(error);
          setStatus('JSONの解析に失敗しました。ファイルの形式を確認してください。', 'error');
        }
      };
      reader.onerror = () => {
        setStatus('ファイルの読み込みに失敗しました。', 'error');
      };
      reader.readAsText(file, 'utf-8');
    }

    function parseQuestions(text) {
      const data = JSON.parse(text);
      if (Array.isArray(data)) {
        return {
          title: '試験対策クイズ',
          description: '選択肢を選んで理解度を確認しましょう。',
          questions: data,
        };
      }
      if (!Array.isArray(data.questions)) {
        throw new Error('questions プロパティに配列が必要です');
      }
      return {
        title: data.title ?? '試験対策クイズ',
        description: data.description ?? '選択肢を選んで理解度を確認しましょう。',
        questions: data.questions,
      };
    }

    function renderQuiz(questions) {
      quizContainer.innerHTML = '';

      if (!Array.isArray(questions) || questions.length === 0) {
        const notice = document.createElement('p');
        notice.className = 'quiz__empty';
        notice.textContent = '問題が見つかりません。questions.json の内容を確認してください。';
        quizContainer.appendChild(notice);
        return;
      }

      questions.forEach((question, index) => {
        const node = questionTemplate.content.cloneNode(true);
        const titleEl = node.querySelector('.question__title');
        const typeEl = node.querySelector('.question__type');
        const formEl = node.querySelector('.question__form');
        const showAnswerBtn = node.querySelector('.show-answer');
        const resetBtn = node.querySelector('.reset');
        const editBtn = node.querySelector('.edit-question');
        const feedbackEl = node.querySelector('.question__feedback');
        const resultEl = node.querySelector('.question__result');
        const explanationEl = node.querySelector('.question__explanation');
        const editContainer = node.querySelector('.question__edit');
        const editOptionsList = node.querySelector('.question__edit-options-list');
        const editExplanation = node.querySelector('.question__edit-explanation');
        const partialListEl = node.querySelector('.question__partial-list');
        const partialBuilderOptionsEl = node.querySelector('.question__partial-options');
        const addPartialBtn = node.querySelector('.partial-add');
        const clearPartialBtn = node.querySelector('.partial-clear');
        const saveEditBtn = node.querySelector('.save-edit');
        const cancelEditBtn = node.querySelector('.cancel-edit');
        const editMessageEl = node.querySelector('.question__edit-message');

        const questionId = `q${index + 1}`;

        titleEl.textContent = `${index + 1}. ${question.prompt}`;
        typeEl.textContent = QUESTION_TYPE_LABEL[question.type] ?? '';

        buildOptions(formEl, question, questionId);

        showAnswerBtn.addEventListener('click', () => {
          const selectedValues = getSelectedValues(formEl);
          if (selectedValues.length === 0) {
            resultEl.textContent = '選択肢を選んでから答えを表示してください。';
            feedbackEl.classList.remove('is-incorrect', 'is-partial');
            feedbackEl.hidden = false;
            return;
          }
          const evaluation = evaluateAnswer(question, selectedValues);
          decorateOptions(formEl, question, selectedValues, evaluation);
          resultEl.textContent = RESULT_MESSAGES[evaluation.status] ?? '結果を確認してください。';
          feedbackEl.classList.remove('is-incorrect', 'is-partial');
          if (evaluation.status === 'incorrect') {
            feedbackEl.classList.add('is-incorrect');
          } else if (evaluation.status === 'partial') {
            feedbackEl.classList.add('is-partial');
          }
          explanationEl.textContent = `補足: ${question.explanation}`;
          feedbackEl.hidden = false;
          showAnswerBtn.disabled = true;
        });

        resetBtn.addEventListener('click', () => {
          Array.from(formEl.elements).forEach((input) => {
            if (input instanceof HTMLInputElement) {
              input.checked = false;
            }
          });
          clearDecorations(formEl);
          feedbackEl.hidden = true;
          feedbackEl.classList.remove('is-incorrect', 'is-partial');
          showAnswerBtn.disabled = false;
        });

        editBtn.addEventListener('click', () => {
          if (!currentPayload) {
            return;
          }
          populateEditForm(
            question,
            editOptionsList,
            editExplanation,
            index,
            partialListEl,
            partialBuilderOptionsEl,
          );
          clearSelections(partialBuilderOptionsEl);
          showEditMessage(editMessageEl, '', 'clear');
          editContainer.hidden = false;
          editBtn.disabled = true;
        });

        cancelEditBtn.addEventListener('click', () => {
          editContainer.hidden = true;
          editBtn.disabled = false;
          showEditMessage(editMessageEl, '', 'clear');
        });

        addPartialBtn.addEventListener('click', () => {
          const optionMap = createOptionMap(question);
          const selection = collectEditSelections(partialBuilderOptionsEl).map(String);
          const normalized = selection.slice().sort();
          if (question.type === 'single') {
            if (normalized.length !== 1) {
              showEditMessage(editMessageEl, '単一選択の問題では部分正解も1つ選択してください。', 'error');
              return;
            }
            if (normalized[0] === String(question.answer)) {
              showEditMessage(editMessageEl, '正解と同じ選択肢は部分正解に設定できません。', 'error');
              return;
            }
          } else {
            if (normalized.length === 0) {
              showEditMessage(editMessageEl, '1つ以上の選択肢を選んでから追加してください。', 'error');
              return;
            }
            const correctValues = getCorrectValues(question).slice().sort();
            if (arraysEqual(normalized, correctValues)) {
              showEditMessage(editMessageEl, '正解と同じ組み合わせは部分正解に設定できません。', 'error');
              return;
            }
          }
          if (normalized.length === 0) {
            showEditMessage(editMessageEl, '部分正解にする選択肢を選んでください。', 'error');
            return;
          }
          if (hasPartialCombination(partialListEl, normalized)) {
            showEditMessage(editMessageEl, '同じ部分正解パターンが既に存在します。', 'error');
            return;
          }
          appendPartialItem(partialListEl, normalized, optionMap);
          clearSelections(partialBuilderOptionsEl);
          showEditMessage(editMessageEl, '部分正解パターンを追加しました。', 'success');
        });

        clearPartialBtn.addEventListener('click', () => {
          clearSelections(partialBuilderOptionsEl);
          showEditMessage(editMessageEl, '部分正解の選択をクリアしました。', 'success');
        });

        partialListEl.addEventListener('click', (event) => {
          const removeBtn = event.target.closest('.partial-remove');
          if (!removeBtn) {
            return;
          }
          const item = removeBtn.closest('.question__partial-item');
          if (!item) {
            return;
          }
          item.remove();
          ensurePartialEmptyState(partialListEl);
          showEditMessage(editMessageEl, '部分正解パターンを削除しました。', 'success');
        });

        saveEditBtn.addEventListener('click', () => {
          if (!currentPayload) {
            return;
          }
          const selectedValues = collectEditSelections(editOptionsList);
          if (question.type === 'single') {
            if (selectedValues.length !== 1) {
              showEditMessage(editMessageEl, '単一選択の問題では正解を1つ選択してください。', 'error');
              return;
            }
            currentPayload.questions[index].answer = selectedValues[0];
            question.answer = selectedValues[0];
          } else {
            if (selectedValues.length === 0) {
              showEditMessage(editMessageEl, '1つ以上の正解を選択してください。', 'error');
              return;
            }
            currentPayload.questions[index].answer = selectedValues;
            question.answer = selectedValues;
          }
          const newExplanation = editExplanation.value.trim();
          currentPayload.questions[index].explanation = newExplanation;
          question.explanation = newExplanation;
          const partialCombos = collectPartialCombos(partialListEl)
            .map((combo) => combo.map(String).sort())
            .filter((combo) => combo.length > 0);
          if (question.type === 'single') {
            const storedPartials = partialCombos.map((combo) => combo[0]).filter(Boolean);
            if (storedPartials.length > 0) {
              currentPayload.questions[index].partialAnswers = storedPartials;
              question.partialAnswers = storedPartials.slice();
            } else {
              delete currentPayload.questions[index].partialAnswers;
              delete question.partialAnswers;
            }
          } else {
            if (partialCombos.length > 0) {
              currentPayload.questions[index].partialAnswers = partialCombos.map((combo) => combo.slice());
              question.partialAnswers = partialCombos.map((combo) => combo.slice());
            } else {
              delete currentPayload.questions[index].partialAnswers;
              delete question.partialAnswers;
            }
          }
          setStatus(`「${truncateText(question.prompt, 24)}」の正解と補足を更新しました。JSONをダウンロードして保存してください。`, 'success');
          renderQuiz(currentPayload.questions);
          updateDownloadState(true);
        });

        quizContainer.appendChild(node);
      });
    }

    function openBuilder() {
      ensurePayload();
      builderPanel.hidden = false;
      builderToggleBtn.textContent = '追加フォームを閉じる';
      builderToggleBtn.setAttribute('aria-expanded', 'true');
      resetBuilderForm();
      builderPromptInput.focus();
    }

    function closeBuilder() {
      builderPanel.hidden = true;
      builderToggleBtn.textContent = '新しい問題を追加';
      builderToggleBtn.setAttribute('aria-expanded', 'false');
      resetBuilderForm({ keepOpen: true });
      showBuilderMessage('', 'clear');
    }

    function resetBuilderForm({ keepOpen = false } = {}) {
      builderForm.reset();
      builderOptionCounter = 0;
      builderOptionsContainer.innerHTML = '';
      builderPartialList.innerHTML = '';
      builderPartialOptions.innerHTML = '';
      for (let i = 0; i < 4; i += 1) {
        addBuilderOptionRow();
      }
      const firstCorrect = builderOptionsContainer.querySelector('.builder-correct-input');
      if (firstCorrect) {
        firstCorrect.checked = true;
      }
      updateBuilderOptionIndices();
      syncBuilderCorrectInputs();
      ensurePartialEmptyState(builderPartialList);
      updateBuilderPartialOptions();
      clearSelections(builderPartialOptions);
      showBuilderMessage('', 'clear');
      if (!keepOpen && !builderPanel.hidden) {
        builderPromptInput.focus();
      }
    }

    function addBuilderOptionRow(initialText = '') {
      builderOptionCounter += 1;
      const key = `opt${builderOptionCounter}`;

      const row = document.createElement('div');
      row.className = 'builder-option';
      row.dataset.optionKey = key;

      const indexEl = document.createElement('span');
      indexEl.className = 'builder-option-index';
      indexEl.textContent = builderOptionsContainer.children.length + 1;

      const inputWrapper = document.createElement('div');
      inputWrapper.className = 'builder-option-input';

      const textInput = document.createElement('input');
      textInput.type = 'text';
      textInput.className = 'builder-option-text';
      textInput.placeholder = '選択肢の内容';
      textInput.value = initialText;
      inputWrapper.appendChild(textInput);

      const controls = document.createElement('div');
      controls.className = 'builder-option-controls';

      const correctLabel = document.createElement('label');
      const correctInput = document.createElement('input');
      correctInput.type = 'radio';
      correctInput.name = 'builder-correct';
      correctInput.className = 'builder-correct-input';
      correctLabel.append(correctInput, document.createTextNode('正解')); 

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'btn btn-secondary builder-option-remove';
      removeBtn.textContent = '削除';

      controls.append(correctLabel, removeBtn);

      row.append(indexEl, inputWrapper, controls);
      builderOptionsContainer.appendChild(row);
    }

    function getBuilderOptionRows() {
      return Array.from(builderOptionsContainer.querySelectorAll('.builder-option'));
    }

    function updateBuilderOptionIndices() {
      getBuilderOptionRows().forEach((row, index) => {
        const indexEl = row.querySelector('.builder-option-index');
        if (indexEl) {
          indexEl.textContent = index + 1;
        }
      });
    }

    function syncBuilderCorrectInputs() {
      const type = builderTypeSelect.value === 'multiple' ? 'multiple' : 'single';
      const rows = getBuilderOptionRows();
      let hasChecked = false;
      rows.forEach((row) => {
        const input = row.querySelector('.builder-correct-input');
        if (!input) {
          return;
        }
        input.type = type === 'multiple' ? 'checkbox' : 'radio';
        input.name = type === 'multiple' ? `${row.dataset.optionKey}-correct` : 'builder-correct';
        if (type === 'single') {
          if (input.checked) {
            if (!hasChecked) {
              hasChecked = true;
            } else {
              input.checked = false;
            }
          }
        }
      });
      if (type === 'single' && !rows.some((row) => row.querySelector('.builder-correct-input')?.checked)) {
        const first = rows[0]?.querySelector('.builder-correct-input');
        if (first) {
          first.checked = true;
        }
      }
    }

    function showBuilderMessage(message, mode) {
      builderMessageEl.textContent = message;
      builderMessageEl.hidden = message === '';
      builderMessageEl.classList.remove('is-error', 'is-success');
      if (mode === 'error') {
        builderMessageEl.classList.add('is-error');
      } else if (mode === 'success') {
        builderMessageEl.classList.add('is-success');
      }
    }

    function createBuilderOptionMap() {
      const map = new Map();
      getBuilderOptionRows().forEach((row) => {
        const key = row.dataset.optionKey;
        const text = row.querySelector('.builder-option-text')?.value.trim() ?? '';
        map.set(key, text || key);
      });
      return map;
    }

    function getBuilderCorrectKeys() {
      return getBuilderOptionRows()
        .filter((row) => row.querySelector('.builder-correct-input')?.checked)
        .map((row) => row.dataset.optionKey);
    }

    function updateBuilderPartialOptions() {
      const optionMap = createBuilderOptionMap();
      builderPartialOptions.innerHTML = '';
      const type = builderTypeSelect.value === 'multiple' ? 'multiple' : 'single';
      optionMap.forEach((label, key) => {
        const optionLabel = document.createElement('label');
        optionLabel.className = 'question__edit-option';

        const input = document.createElement('input');
        if (type === 'multiple') {
          input.type = 'checkbox';
          input.name = `${key}-partial`;
        } else {
          input.type = 'radio';
          input.name = 'builder-partial-single';
        }
        input.value = key;

        const text = document.createElement('span');
        text.textContent = label;

        optionLabel.append(input, text);
        builderPartialOptions.appendChild(optionLabel);
      });
    }

    function updateBuilderPartialLabels() {
      const optionMap = createBuilderOptionMap();
      builderPartialList.querySelectorAll('.question__partial-item').forEach((item) => {
        const values = JSON.parse(item.dataset.values ?? '[]');
        const labelEl = item.querySelector('.question__partial-label');
        if (!labelEl) {
          return;
        }
        labelEl.innerHTML = '';
        values.forEach((value) => {
          const chip = document.createElement('span');
          chip.className = 'question__partial-chip';
          chip.textContent = optionMap.get(value) ?? value;
          labelEl.appendChild(chip);
        });
      });
      ensurePartialEmptyState(builderPartialList);
    }

    function removeBuilderPartialsForKey(key) {
      let removed = false;
      builderPartialList.querySelectorAll('.question__partial-item').forEach((item) => {
        const values = JSON.parse(item.dataset.values ?? '[]');
        if (values.includes(key)) {
          item.remove();
          removed = true;
        }
      });
      if (removed) {
        ensurePartialEmptyState(builderPartialList);
      }
    }

    function removeInvalidBuilderPartials() {
      const optionMap = createBuilderOptionMap();
      const type = builderTypeSelect.value === 'multiple' ? 'multiple' : 'single';
      const correctKeys = new Set(getBuilderCorrectKeys());
      let changed = false;
      builderPartialList.querySelectorAll('.question__partial-item').forEach((item) => {
        const combo = JSON.parse(item.dataset.values ?? '[]');
        if (combo.length === 0) {
          item.remove();
          changed = true;
          return;
        }
        if (combo.some((key) => !optionMap.has(key))) {
          item.remove();
          changed = true;
          return;
        }
        if (type === 'single' && combo.length !== 1) {
          item.remove();
          changed = true;
          return;
        }
        if (type === 'multiple') {
          const isExactMatch = combo.every((key) => correctKeys.has(key)) && combo.length === correctKeys.size;
          if (isExactMatch) {
            item.remove();
            changed = true;
          }
        } else {
          if (correctKeys.has(combo[0])) {
            item.remove();
            changed = true;
          }
        }
      });
      if (changed) {
        ensurePartialEmptyState(builderPartialList);
      }
      updateBuilderPartialLabels();
    }

    function clearBuilderPartialSelections() {
      clearSelections(builderPartialOptions);
    }

    function ensurePayload() {
      if (!currentPayload) {
        currentPayload = {
          title: titleEl.textContent || '試験対策クイズ',
          description: descriptionEl.textContent || '選択肢を選んで理解度を確認しましょう。',
          questions: [],
        };
        updateDownloadState(true);
      }
      if (!Array.isArray(currentPayload.questions)) {
        currentPayload.questions = [];
      }
    }

    function buildQuestionFromBuilder() {
      const type = builderTypeSelect.value === 'multiple' ? 'multiple' : 'single';
      const prompt = builderPromptInput.value.trim();
      if (!prompt) {
        throw new Error('問題文を入力してください。');
      }
      const rows = getBuilderOptionRows();
      if (rows.length < 2) {
        throw new Error('選択肢は最低2つ必要です。');
      }

      const optionKeyToId = new Map();
      const options = [];
      const correctKeys = [];
      rows.forEach((row, index) => {
        const textInput = row.querySelector('.builder-option-text');
        const rawText = textInput?.value?.trim() ?? '';
        if (!rawText) {
          throw new Error(`選択肢${index + 1}のテキストを入力してください。`);
        }
        const key = row.dataset.optionKey;
        const optionId = createOptionIdFromIndex(index);
        optionKeyToId.set(key, optionId);
        options.push({ id: optionId, text: rawText });
        const correctInput = row.querySelector('.builder-correct-input');
        if (correctInput?.checked) {
          correctKeys.push(key);
        }
      });

      if (type === 'single') {
        if (correctKeys.length !== 1) {
          throw new Error('単一選択では正解を1つ選択してください。');
        }
      } else if (correctKeys.length === 0) {
        throw new Error('複数選択では少なくとも1つ正解を選択してください。');
      }

      const correctValues = correctKeys
        .map((key) => optionKeyToId.get(key))
        .filter(Boolean);

      const explanation = builderExplanationInput.value.trim();

      const partialCombosKeys = collectPartialCombos(builderPartialList);
      let partialAnswers;
      if (partialCombosKeys.length > 0) {
        if (type === 'single') {
          const singles = Array.from(
            new Set(
              partialCombosKeys
                .map((combo) => optionKeyToId.get(combo[0]))
                .filter((value) => value && !correctValues.includes(value)),
            ),
          );
          if (singles.length > 0) {
            partialAnswers = singles;
          }
        } else {
          const correctSorted = correctValues.slice().sort();
          const combos = partialCombosKeys
            .map((combo) =>
              combo
                .map((key) => optionKeyToId.get(key))
                .filter(Boolean)
                .sort(),
            )
            .filter((combo) => combo.length > 0 && !arraysEqual(combo, correctSorted));
          if (combos.length > 0) {
            partialAnswers = combos;
          }
        }
      }

      const inputId = builderIdInput.value.trim();
      const questionId = inputId || createQuestionId(prompt);
      if (currentPayload?.questions?.some((q) => q.id === questionId)) {
        throw new Error('指定した問題IDは既に使用されています。別のIDを指定してください。');
      }

      const question = {
        id: questionId,
        type,
        prompt,
        options,
        answer: type === 'single' ? correctValues[0] : correctValues,
        explanation,
      };

      if (partialAnswers && partialAnswers.length > 0) {
        question.partialAnswers = partialAnswers;
      }

      return question;
    }

    function populateEditForm(
      question,
      correctContainerEl,
      explanationEl,
      index,
      partialListEl,
      partialBuilderOptionsEl,
    ) {
      buildCorrectOptionInputs(question, correctContainerEl, index);
      buildPartialBuilderOptions(question, partialBuilderOptionsEl, index);
      renderPartialList(question, partialListEl);
      explanationEl.value = question.explanation ?? '';
    }

    function collectEditSelections(containerEl) {
      return Array.from(containerEl.querySelectorAll('input:checked')).map((input) => input.value);
    }

    function buildCorrectOptionInputs(question, containerEl, index) {
      containerEl.innerHTML = '';
      const correctSet = new Set(getCorrectValues(question));
      const inputBaseName = `${question.id ?? `q${index + 1}`}-edit`;
      question.options.forEach((option) => {
        const optionLabel = document.createElement('label');
        optionLabel.className = 'question__edit-option';

        const input = document.createElement('input');
        input.type = question.type === 'multiple' ? 'checkbox' : 'radio';
        input.name = question.type === 'multiple' ? `${inputBaseName}[]` : inputBaseName;
        input.value = String(option.id);
        input.checked = correctSet.has(String(option.id));

        const text = document.createElement('span');
        text.textContent = option.text;

        optionLabel.append(input, text);
        containerEl.append(optionLabel);
      });
    }

    function buildPartialBuilderOptions(question, containerEl, index) {
      containerEl.innerHTML = '';
      const inputBaseName = `${question.id ?? `q${index + 1}`}-partial`;
      question.options.forEach((option) => {
        const optionLabel = document.createElement('label');
        optionLabel.className = 'question__edit-option';

        const input = document.createElement('input');
        if (question.type === 'multiple') {
          input.type = 'checkbox';
          input.name = `${inputBaseName}[]`;
        } else {
          input.type = 'radio';
          input.name = inputBaseName;
        }
        input.value = String(option.id);

        const text = document.createElement('span');
        text.textContent = option.text;

        optionLabel.append(input, text);
        containerEl.append(optionLabel);
      });
    }

    function renderPartialList(question, listEl) {
      listEl.innerHTML = '';
      const combos = normalizePartialAnswers(question);
      const optionMap = createOptionMap(question);
      combos.forEach((combo) => {
        const sortedCombo = combo.slice().sort();
        const item = createPartialItemElement(sortedCombo, optionMap);
        listEl.appendChild(item);
      });
      ensurePartialEmptyState(listEl);
    }

    function createPartialItemElement(combo, optionMap) {
      const item = document.createElement('div');
      item.className = 'question__partial-item';
      item.dataset.values = JSON.stringify(combo);

      const label = document.createElement('span');
      label.className = 'question__partial-label';
      combo.forEach((value) => {
        const chip = document.createElement('span');
        chip.className = 'question__partial-chip';
        chip.textContent = optionMap.get(value) ?? value;
        label.appendChild(chip);
      });

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'btn btn-secondary partial-remove';
      removeBtn.textContent = '削除';

      item.append(label, removeBtn);
      return item;
    }

    function appendPartialItem(listEl, combo, optionMap) {
      const placeholder = listEl.querySelector('.question__partial-empty');
      if (placeholder) {
        placeholder.remove();
      }
      const item = createPartialItemElement(combo, optionMap);
      listEl.appendChild(item);
      ensurePartialEmptyState(listEl);
    }

    function ensurePartialEmptyState(listEl) {
      const hasItem = listEl.querySelector('.question__partial-item');
      const placeholder = listEl.querySelector('.question__partial-empty');
      if (!hasItem && !placeholder) {
        const empty = document.createElement('p');
        empty.className = 'question__partial-empty';
        empty.textContent = '部分正解は設定されていません。';
        listEl.appendChild(empty);
      } else if (hasItem && placeholder) {
        placeholder.remove();
      }
    }

    function hasPartialCombination(listEl, combo) {
      const target = JSON.stringify(combo);
      return Array.from(listEl.querySelectorAll('.question__partial-item')).some(
        (item) => item.dataset.values === target,
      );
    }

    function collectPartialCombos(listEl) {
      return Array.from(listEl.querySelectorAll('.question__partial-item')).map((item) => {
        try {
          const values = JSON.parse(item.dataset.values ?? '[]');
          return Array.isArray(values) ? values : [];
        } catch {
          return [];
        }
      });
    }

    function clearSelections(containerEl) {
      containerEl.querySelectorAll('input').forEach((input) => {
        if (input instanceof HTMLInputElement) {
          input.checked = false;
        }
      });
    }

    function createOptionMap(question) {
      const map = new Map();
      question.options.forEach((option) => {
        map.set(String(option.id), option.text);
      });
      return map;
    }

    function showEditMessage(messageEl, text, mode) {
      messageEl.textContent = text;
      messageEl.hidden = text === '';
      messageEl.classList.remove('is-error', 'is-success');
      if (mode === 'error') {
        messageEl.classList.add('is-error');
      } else if (mode === 'success') {
        messageEl.classList.add('is-success');
      }
    }

    function truncateText(text, maxLength) {
      const trimmed = text ?? '';
      if (trimmed.length <= maxLength) {
        return trimmed;
      }
      return `${trimmed.slice(0, maxLength)}…`;
    }

    function applyMetadata(payload) {
      titleEl.textContent = payload.title;
      descriptionEl.textContent = payload.description;
    }

    function buildOptions(formEl, question, groupName) {
      question.options.forEach((option) => {
        const wrapper = document.createElement('label');
        wrapper.className = 'option';

        const input = document.createElement('input');
        input.type = question.type === 'multiple' ? 'checkbox' : 'radio';
        input.name = question.type === 'multiple' ? `${groupName}[]` : groupName;
        input.value = String(option.id);

        const text = document.createElement('span');
        text.textContent = option.text;

        wrapper.appendChild(input);
        wrapper.appendChild(text);

        formEl.appendChild(wrapper);
      });
    }

    function getSelectedValues(formEl) {
      return Array.from(formEl.querySelectorAll('input:checked')).map((input) => input.value);
    }

    function evaluateAnswer(question, selectedValues) {
      const correctValues = getCorrectValues(question).sort();
      const actual = selectedValues.slice().map(String).sort();

      if (arraysEqual(actual, correctValues)) {
        return { status: 'correct', matchedSet: correctValues };
      }

      const partialCombos = normalizePartialAnswers(question);
      for (const combo of partialCombos) {
        if (arraysEqual(actual, combo)) {
          return { status: 'partial', matchedSet: combo };
        }
      }

      if (question.type === 'multiple') {
        const correctSet = new Set(correctValues);
        const hasSelection = actual.length > 0;
        const isSubsetOfCorrect = actual.every((value) => correctSet.has(value));
        if (hasSelection && isSubsetOfCorrect) {
          return { status: 'partial', matchedSet: actual };
        }
      }

      return { status: 'incorrect', matchedSet: [] };
    }

    function decorateOptions(formEl, question, selectedValues, evaluation) {
      clearDecorations(formEl);
      const correctValues = getCorrectValues(question);
      const correctSet = new Set(correctValues);
      const partialSet = new Set(evaluation.status === 'partial' ? evaluation.matchedSet : []);
      const selectedSet = new Set(selectedValues);

      formEl.querySelectorAll('.option').forEach((optionEl) => {
        const input = optionEl.querySelector('input');
        if (!(input instanceof HTMLInputElement)) {
          return;
        }
        const value = input.value;
        const isSelected = selectedSet.has(value);
        const isCorrect = correctSet.has(value);
        const isPartial = partialSet.has(value);

        if (isCorrect) {
          optionEl.classList.add('is-correct');
        }
        if (isPartial && !isCorrect) {
          optionEl.classList.add('is-partial');
        }
        if (isSelected && !isCorrect && !isPartial) {
          optionEl.classList.add('is-incorrect');
        }
        if (!isSelected && !isCorrect && !isPartial && evaluation.status === 'incorrect') {
          optionEl.classList.add('muted');
        }
      });
    }

    function clearDecorations(formEl) {
      formEl.querySelectorAll('.option').forEach((optionEl) => {
        optionEl.classList.remove('is-correct', 'is-incorrect', 'is-partial', 'muted');
      });
    }

    function getCorrectValues(question) {
      if (Array.isArray(question.answer)) {
        return question.answer.map(String);
      }
      return [String(question.answer)];
    }

    function normalizePartialAnswers(question) {
      const { partialAnswers } = question;
      if (!partialAnswers) {
        return [];
      }
      const asArray = Array.isArray(partialAnswers) ? partialAnswers : [partialAnswers];
      return asArray.map((entry) => {
        if (Array.isArray(entry)) {
          return entry.map(String).sort();
        }
        return [String(entry)];
      });
    }

    function arraysEqual(a, b) {
      if (a.length !== b.length) {
        return false;
      }
      return a.every((value, index) => value === b[index]);
    }

    function updateDownloadState(enabled) {
      downloadButton.disabled = !enabled;
    }

    function downloadCurrentPayload() {
      if (!currentPayload) {
        return;
      }
      const content = JSON.stringify(currentPayload, null, 2);
      const blob = new Blob([content], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const filename = createDownloadFilename(currentPayload.title);

      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = filename;
      anchor.click();

      URL.revokeObjectURL(url);
      setStatus(`${filename} をダウンロードしました。`, 'success');
    }

    function createDownloadFilename(rawTitle) {
      const base = (rawTitle ?? 'questions').replace(/[\\/:*?"<>|]/g, '_').trim() || 'questions';
      return `${base}_quiz.json`;
    }

    function createOptionIdFromIndex(index) {
      const alphabet = 'abcdefghijklmnopqrstuvwxyz';
      let n = index;
      let result = '';
      do {
        result = alphabet[n % 26] + result;
        n = Math.floor(n / 26) - 1;
      } while (n >= 0);
      return result;
    }

    function createQuestionId(prompt) {
      const base = slugify(prompt).slice(0, 48) || 'question';
      if (!currentPayload?.questions) {
        return base;
      }
      let candidate = base;
      let counter = 2;
      const existing = new Set(currentPayload.questions.map((q) => q.id));
      while (existing.has(candidate)) {
        candidate = `${base}-${counter}`;
        counter += 1;
      }
      return candidate;
    }

    function slugify(text) {
      return (text ?? '')
        .toLowerCase()
        .replace(/\s+/g, '-')
        .replace(/[^a-z0-9-]/g, '')
        .replace(/-+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    function setStatus(message, tone = 'info') {
      statusEl.textContent = message;
      statusEl.classList.remove('status--info', 'status--success', 'status--warn', 'status--error');
      const toneClass = {
        info: 'status--info',
        success: 'status--success',
        warn: 'status--warn',
        error: 'status--error',
      }[tone] ?? 'status--info';
      statusEl.classList.add(toneClass);
    }
  </script>
</body>
